<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: 24px;
      color: #1e293b;
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
    }
    .card-subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }
    .filter-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
    }
    .filter-group input, .filter-group select {
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      cursor: pointer;
    }

    .chart-box {
      position: relative;
      height: 340px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="dashboard-container">

  <!-- Card 1: สรุปยอดผลิตภาพรวมรายวัน -->
  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title">📊 สรุปยอดผลิตภาพรวมรายวัน (Daily Summary)</h2>
        <div class="card-subtitle">แสดงข้อมูลเป้าหมายและยอดทำได้จริงแยกตาม Line การผลิต</div>
      </div>
      <div class="filter-group">
        <label for="dateFilter">📅 วันที่:</label>
        <input type="date" id="dateFilter" onchange="loadDashboardData()">
      </div>
    </div>
    <div class="chart-box">
      <canvas id="dailySummaryChart"></canvas>
    </div>
  </div>

  <!-- Card 2: ติดตามผลการผลิตรายชั่วโมง -->
  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title">⏱️ ติดตามผลการผลิตรายชั่วโมง (Hourly Tracking)</h2>
        <div class="card-subtitle" id="targetPerHourSub">เป้าหมายมาตรฐาน: -- ชิ้น / ชั่วโมง</div>
      </div>
      <div class="filter-group">
        <label for="lineFilter">เลือกลูกไลน์:</label>
        <select id="lineFilter" onchange="loadHourlyChartData()">
          <option value="Line B">LINE B</option>
          <option value="Line C">LINE C</option>
          <option value="Line D">LINE D</option>
          <option value="Line E">LINE E</option>
          <option value="Line F">LINE F</option>
          <option value="Line G">LINE G</option>
        </select>
      </div>
    </div>
    <div class="chart-box">
      <canvas id="hourlyTrackingChart"></canvas>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec"; 

  let dailyChart = null;
  let hourlyChart = null;

  const DEFAULT_SLOTS = [
    "08.30-09.30", "09.30-10.30", "10.30-11.30", "11.30-12.30",
    "12.30-13.30", "13.30-14.30", "14.30-15.30", "15.30-16.30",
    "16.30-17.30", "17.30-18.30", "18.30-19.30"
  ];

  // ตั้งค่าเริ่มต้นวันที่เป็นวันปัจจุบัน
  document.getElementById('dateFilter').valueAsDate = new Date();

  window.addEventListener('DOMContentLoaded', () => {
    loadDashboardData();
  });

  async function loadDashboardData() {
    await Promise.all([
      loadDailySummaryData(),
      loadHourlyChartData()
    ]);
  }

  // 1. โหลดข้อมูลกราฟ Daily Summary (Stacked Bar Chart)
  async function loadDailySummaryData() {
    const selectedDate = document.getElementById('dateFilter').value;
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getDailySummary&date=${selectedDate}`);
      const result = await res.json();
      const dataList = result.data || [];

      const labels = dataList.map(item => item.line);
      const actualData = dataList.map(item => item.actual);
      const gapData = dataList.map(item => item.gap);

      renderDailyChart(labels, actualData, gapData);
    } catch (err) {
      console.error("Error loading daily summary:", err);
    }
  }

  function renderDailyChart(labels, actualData, gapData) {
    const ctx = document.getElementById('dailySummaryChart').getContext('2d');
    
    if (dailyChart) dailyChart.destroy();

    dailyChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Actual (ทำได้จริง)',
            data: actualData,
            backgroundColor: '#10b981',
            borderRadius: 6
          },
          {
            label: 'Target Gap (ส่วนต่างเป้าหมาย)',
            data: gapData,
            backgroundColor: '#ef4444',
            borderRadius: 6
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { stacked: true, grid: { display: false } },
          y: { stacked: true, beginAtZero: true }
        },
        plugins: {
          legend: { position: 'top' }
        }
      }
    });
  }

  // 2. โหลดข้อมูลกราฟ Hourly Tracking (Bar Chart + Dynamic Target Line)
  async function loadHourlyChartData() {
    const selectedDate = document.getElementById('dateFilter').value;
    const selectedLine = document.getElementById('lineFilter').value;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getHourlyTracking&line=${encodeURIComponent(selectedLine)}&date=${selectedDate}`);
      const result = await res.json();

      const targetPerHour = result.targetPerHour || 0;
      const hourlyMap = result.hourlyData || {};

      document.getElementById('targetPerHourSub').innerText = `เป้าหมายมาตรฐาน: ${targetPerHour.toLocaleString()} ชิ้น / ชั่วโมง`;

      const actualValues = DEFAULT_SLOTS.map(slot => hourlyMap[slot] || 0);
      const targetLineData = DEFAULT_SLOTS.map(() => targetPerHour);

      renderHourlyChart(DEFAULT_SLOTS, actualValues, targetLineData, targetPerHour);
    } catch (err) {
      console.error("Error loading hourly tracking:", err);
    }
  }

  function renderHourlyChart(labels, actualValues, targetLineData, targetPerHour) {
    const ctx = document.getElementById('hourlyTrackingChart').getContext('2d');

    if (hourlyChart) hourlyChart.destroy();

    // กำหนดสีของแท่งกราฟ: ถ้าถึงเป้าเป็นสีเขียว ถ้าไม่ถึงเป็นสีส้ม
    const backgroundColors = actualValues.map(val => val >= targetPerHour && targetPerHour > 0 ? '#10b981' : '#f59e0b');

    hourlyChart = new Chart(ctx, {
      data: {
        labels: labels,
        datasets: [
          {
            type: 'line',
            label: `Target / ชม. (${targetPerHour} ชิ้น)`,
            data: targetLineData,
            borderColor: '#6366f1',
            borderWidth: 2,
            borderDash: [6, 6],
            pointRadius: 0,
            fill: false
          },
          {
            type: 'bar',
            label: 'Actual รายชั่วโมง',
            data: actualValues,
            backgroundColor: backgroundColors,
            borderRadius: 6
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { grid: { display: false } },
          y: { beginAtZero: true }
        },
        plugins: {
          legend: { position: 'top' }
        }
      }
    });
  }
</script>

</body>
</html>
