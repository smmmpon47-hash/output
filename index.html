<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Line Dashboard</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --border-color: #e0e0e0;
    }

    body {
      font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: var(--card-bg);
      padding: 20px 25px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-panel h1 {
      margin: 0;
      font-size: 24px;
      color: var(--primary-color);
    }

    .url-config-group {
      display: flex;
      gap: 10px;
      align-items: center;
      background-color: #f8f9fa;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px dashed var(--border-color);
    }

    .url-config-group label {
      font-weight: bold;
      white-space: nowrap;
      color: #555;
    }

    .url-config-group input {
      flex-grow: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      font-size: 13px;
    }

    .filter-group {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-group input, .filter-group select, .filter-group button {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      font-size: 14px;
    }

    .btn-search {
      background-color: var(--accent-color);
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-search:hover {
      background-color: #2980b9;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 15px;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 8px;
    }

    .chart-box {
      position: relative;
      height: 350px;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }

    th {
      background-color: #f8f9fa;
      color: var(--primary-color);
      font-weight: 600;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-ok { background-color: #e8f8f5; color: #27ae60; }
    .status-gap { background-color: #fadbd8; color: #e74c3c; }

    @media (max-width: 768px) {
      .header-top { flex-direction: column; gap: 15px; align-items: flex-start; }
      .grid-container { grid-template-columns: 1fr; }
      .url-config-group { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header & Controls -->
  <div class="header-panel">
    <div class="header-top">
      <h1>📊 Production Line Dashboard</h1>
      
      <!-- Filter Group -->
      <div class="filter-group">
        <label for="searchDate">วันที่:</label>
        <input type="date" id="searchDate">
        
        <label for="lineSelect">Line:</label>
        <select id="lineSelect">
          <option value="B">Line B</option>
          <option value="C">Line C</option>
          <option value="D">Line D</option>
          <option value="E">Line E</option>
          <option value="F">Line F</option>
          <option value="G">Line G</option>
        </select>

        <button class="btn-search" onclick="loadDashboardData()">🔍 ค้นหา</button>
      </div>
    </div>

    <!-- Web App URL Input Field -->
    <div class="url-config-group">
      <label for="apiUrlInput">🔗 Web App URL:</label>
      <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec">
    </div>
  </div>

  <!-- Content Grid -->
  <div class="grid-container">
    <!-- Graph 1: Hourly Output & Target Tracking -->
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">📈 รายงานยอดผลิตรายชั่วโมง (Hourly Tracking Line <span id="currentLineLabel">B</span>)</div>
      <div class="chart-box">
        <canvas id="hourlyChart"></canvas>
      </div>
    </div>

    <!-- Summary Table -->
    <div class="card" style="grid-column: span 2;">
      <div class="card-title">📋 สรุปภาพรวมการผลิตทุก Line (Daily Summary)</div>
      <div style="overflow-x: auto;">
        <table id="summaryTable">
          <thead>
            <tr>
              <th>Line</th>
              <th>Target รวม</th>
              <th>Actual รวม</th>
              <th>Gap (ส่วนต่าง)</th>
              <th>LOT 1</th>
              <th>Model 1</th>
              <th>Actual 1</th>
              <th>LOT 2</th>
              <th>Model 2</th>
              <th>Actual 2</th>
              <th>เวลาทำงานรวม</th>
            </tr>
          </thead>
          <tbody>
            <!-- Data populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const TIME_SLOTS_ORDER = [
    "08.30-09.30", "09.30-10.30", "10.30-11.30", "11.30-12.30", "12.30-13.30",
    "13.30-14.30", "14.30-15.30", "15.30-16.30", "16.30-17.30", "17.30-18.30", "18.30-19.30"
  ];

  let hourlyChartInstance = null;

  document.addEventListener('DOMContentLoaded', () => {
    // ตั้งค่าวันที่เริ่มต้นเป็นวันนี้
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('searchDate').value = today;

    // ดึง URL ที่เคยบันทึกไว้ใน Browser (ถ้ามี)
    const savedUrl = localStorage.getItem('dashboard_api_url');
    if (savedUrl) {
      document.getElementById('apiUrlInput').value = savedUrl;
      loadDashboardData();
    }
  });

  function getApiUrl() {
    const url = document.getElementById('apiUrlInput').value.trim();
    if (!url) {
      alert('กรุณากรอก Web App URL ก่อนครับ');
      return null;
    }
    // บันทึก URL ไว้ใน LocalStorage เพื่อไม่ต้องกรอกใหม่รอบหน้า
    localStorage.setItem('dashboard_api_url', url);
    return url;
  }

  function loadDashboardData() {
    const apiUrl = getApiUrl();
    if (!apiUrl) return;

    const dateVal = document.getElementById('searchDate').value;
    const lineVal = document.getElementById('lineSelect').value;
    document.getElementById('currentLineLabel').innerText = lineVal;

    fetchHourlyData(apiUrl, dateVal, lineVal);
    fetchDailySummary(apiUrl, dateVal);
  }

  // ดึงข้อมูลกราฟรายชั่วโมง
  function fetchHourlyData(apiUrl, dateStr, lineCode) {
    const url = `${apiUrl}?action=getHourlyTracking&date=${dateStr}&line=${lineCode}`;
    fetch(url)
      .then(res => res.json())
      .then(data => {
        updateHourlyChart(data);
      })
      .catch(err => console.error('Error fetching hourly data:', err));
  }

  // ดึงข้อมูลตาราง สรุปภาพรวม
  function fetchDailySummary(apiUrl, dateStr) {
    const url = `${apiUrl}?action=getDailySummary&date=${dateStr}`;
    fetch(url)
      .then(res => res.json())
      .then(data => {
        updateSummaryTable(data.lines || []);
      })
      .catch(err => console.error('Error fetching summary data:', err));
  }

  // --- ฟังก์ชันอัปเดตกราฟ (Target แบบขั้นบันได) ---
  function updateHourlyChart(data) {
    const ctx = document.getElementById('hourlyChart').getContext('2d');
    
    const hourlyValues = TIME_SLOTS_ORDER.map(slot => data.hourlyData[slot] || 0);
    const targetValues = data.hourlyTargets || TIME_SLOTS_ORDER.map(() => 0);

    if (hourlyChartInstance) {
      hourlyChartInstance.destroy();
    }

    hourlyChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: TIME_SLOTS_ORDER,
        datasets: [
          {
            label: 'Target (เป้าหมาย/ชม.)',
            data: targetValues,
            borderColor: '#e74c3c',
            backgroundColor: 'rgba(231, 76, 60, 0.1)',
            borderWidth: 2,
            borderDash: [5, 5],
            fill: false,
            stepped: 'before', // ทำให้เส้นหักเป็นขั้นบันไดตามช่วงเวลา LOT
            pointRadius: 3
          },
          {
            label: 'Actual (ยอดผลิตจริง/ชม.)',
            data: hourlyValues,
            borderColor: '#2ecc71',
            backgroundColor: 'rgba(46, 204, 113, 0.2)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointRadius: 4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            title: { display: true, text: 'จำนวน (ชิ้น)' }
          },
          x: {
            title: { display: true, text: 'ช่วงเวลา (Time Slot)' }
          }
        },
        plugins: {
          legend: { position: 'top' },
          tooltip: { mode: 'index', intersect: false }
        }
      }
    });
  }

  // อัปเดตข้อมูลตาราง Summary
  function updateSummaryTable(linesData) {
    const tbody = document.querySelector('#summaryTable tbody');
    tbody.innerHTML = '';

    if (linesData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11">ไม่พบข้อมูลการผลิต</td></tr>';
      return;
    }

    linesData.forEach(row => {
      const tr = document.createElement('tr');
      const gapClass = row.gap > 0 ? 'status-gap' : 'status-ok';

      tr.innerHTML = `
        <td><strong>Line ${row.line}</strong></td>
        <td>${row.target.toLocaleString()}</td>
        <td>${row.actual.toLocaleString()}</td>
        <td><span class="status-badge ${gapClass}">${row.gap.toLocaleString()}</span></td>
        <td>${row.lot_number || '-'}</td>
        <td>${row.model1 || '-'}</td>
        <td>${row.actual1.toLocaleString()}</td>
        <td>${row.lot_number2 || '-'}</td>
        <td>${row.model2 || '-'}</td>
        <td>${row.actual2.toLocaleString()}</td>
        <td>${row.total_working_hours} ชม.</td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
